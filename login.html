<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-4">

                <div class="card mt-5 p-4">

                    <h2 class="text-center mb-4">
                        Biblioteca Virtual
                    </h2>

                    <input type="text" id="usuario" class="form-control mb-3" placeholder="Usuário">

                    <input type="password" id="senha" class="form-control mb-3" placeholder="Senha">

                    <button class="btn btn-primary w-100" onclick="login()">
                    Entrar
                </button>

                    <p id="mensagem" class="text-danger mt-3"></p>

                </div>

            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
