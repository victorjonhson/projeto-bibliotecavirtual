<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-4">

                <div class="card p-4 mt-5">

                    <h2 class="text-center mb-4">
                        Cadastro
                    </h2>

                    <input type="text" id="novoUsuario" class="form-control mb-3" placeholder="Usuário">

                    <input type="password" id="novaSenha" class="form-control mb-3" placeholder="Senha">

                    <button class="btn btn-success w-100" onclick="cadastrar()">
                    Cadastrar
                </button>

                    <div class="text-center mt-3">

                        <a href="login.html">
                        Já possui conta? Entrar
                    </a>

                    </div>

                    <p id="mensagem" class="mt-3 text-danger"></p>

                </div>

            </div>

        </div>

    </div>

    <script src="js/cadastro.js"></script>

</body>

</html>
